[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "flash-linear-attention>=0.5.2",
    "huggingface-hub>=1.33.0",
    "tqdm>=4.66.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "statsmodels>=0.15.0",
]

[project.scripts]
se = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sentence_encoders*", "cross_encoder*", "recursive_lm*", "src*"]
namespaces = true
